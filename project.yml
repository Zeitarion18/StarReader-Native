name: StarReaderNative
options:
  bundleIdPrefix: dev.starreader.personalreader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  StarReaderNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starreader.personalreader
        PRODUCT_NAME: StarReaderNative
        INFOPLIST_KEY_CFBundleDisplayName: StarReader
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 31
        INFOPLIST_KEY_CFBundleShortVersionString: "0.3.1"
        INFOPLIST_KEY_CFBundleVersion: "31"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
