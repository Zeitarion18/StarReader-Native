name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - n0-swiftui-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Collapse redundant push/PR builds while iterating on the same branch.
concurrency:
  group: reader-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project StarReaderNative.xcodeproj -scheme StarReaderNative

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project StarReaderNative.xcodeproj \
            -scheme StarReaderNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app identity and release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path("build/Build/Products/Release-iphoneos/StarReaderNative.app/Info.plist")
          with path.open("rb") as file:
              info = plistlib.load(file)
          assert info.get("CFBundleIdentifier") == "dev.starreader.personalreader", info.get("CFBundleIdentifier")
          assert info.get("CFBundleShortVersionString") == "0.3.0", info.get("CFBundleShortVersionString")
          assert info.get("CFBundleVersion") == "30", info.get("CFBundleVersion")
          print("Verified Bundle ID, marketing version and build number for in-place upgrade.")
          PY

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StarReaderNative.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload StarReaderNative-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarReaderNative-unsigned-ipa
          path: StarReaderNative-unsigned.ipa
          if-no-files-found: error
