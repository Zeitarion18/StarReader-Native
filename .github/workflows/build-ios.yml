name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - n0-swiftui-preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project StarReaderNative.xcodeproj -scheme StarReaderNative

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project StarReaderNative.xcodeproj \
            -scheme StarReaderNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StarReaderNative.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload StarReaderNative-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarReaderNative-unsigned-ipa
          path: StarReaderNative-unsigned.ipa
          if-no-files-found: error
